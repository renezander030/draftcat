name: release

# Build and publish the draftcat container image to GitHub Container Registry
# on every version tag (v*). Enables: docker run ghcr.io/renezander030/draftcat
on:
  push:
    tags: ["v*"]
  # Proof only, no publish: a manual run, on any ref, runs only npm-trust-proof, which exchanges the job's OIDC
  # token with npm and says whether npm would take the publish (.github/scripts/npm-trust-proof.mjs).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  npm-trust-proof:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # the OIDC token npm exchanges; nothing is published
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Exchange the OIDC token with npm for the package
        run: node .github/scripts/npm-trust-proof.mjs --out npm-trust-proof.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: npm-trust-proof
          path: npm-trust-proof.json

  verify:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - name: Check release version
        run: |
          test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
          test "$(go run . --version)" = "draftcat ${GITHUB_REF_NAME#v}"
      - run: go test -short -count=1 -timeout 60s ./...
      - run: go test -short -tags voice -count=1 -timeout 60s ./...
      - run: go run . validate
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack --dry-run

  binaries:
    needs: verify
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, platform: linux, arch: x64, extension: "" }
          - { goos: linux, goarch: arm64, platform: linux, arch: arm64, extension: "" }
          - { goos: darwin, goarch: amd64, platform: darwin, arch: x64, extension: "" }
          - { goos: darwin, goarch: arm64, platform: darwin, arch: arm64, extension: "" }
          - { goos: windows, goarch: amd64, platform: win32, arch: x64, extension: ".exe" }
          - { goos: windows, goarch: arm64, platform: win32, arch: arm64, extension: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - name: Build native binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          asset="draftcat-${GITHUB_REF_NAME}-${{ matrix.platform }}-${{ matrix.arch }}${{ matrix.extension }}"
          go build -trimpath -buildvcs=false -ldflags="-s -w -X main.version=${GITHUB_REF_NAME#v}" -o "$asset" .
          gzip -n "$asset"
      - uses: actions/upload-artifact@v4
        with:
          name: draftcat-${{ matrix.platform }}-${{ matrix.arch }}
          path: draftcat-*.gz
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: draftcat-*
          path: dist
          merge-multiple: true
      - name: Publish GitHub release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha256sum draftcat-*.gz > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --clobber draftcat-*.gz SHA256SUMS
          else
            gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --generate-notes --title "$GITHUB_REF_NAME" draftcat-*.gz SHA256SUMS
          fi

  image:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/renezander030/draftcat
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  npm:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Smoke-test the published native asset
        run: |
          node npm/install.js
          test "$(node npm/draftcat.js --version)" = "draftcat ${GITHUB_REF_NAME#v}"
      # npm trusts this workflow (trusted publishing): the job proves itself with its OIDC token, no npm token
      - name: npm publish of each version npm lacks; one npm already serves with the same contents is skipped
        id: already-published
        env:
          NPM_CONFIG_PROVENANCE: true
        run: node .github/scripts/npm-publish-new.mjs --dir . --out already-published.json
